name: Publish v1.6.11
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.6.11.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v1.6.11
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm run test:all
      - name: Build and verify clean Windows and update packages
        run: python3 tools/build-release.py
      - name: Publish verified assets together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Mericsdc/lrx-torn-tracker
        run: |
          if gh release view v1.6.11 --json isDraft > stage/existing-release.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("stage/existing-release.json"))["isDraft"])')" = 'True'
          else
            gh release create v1.6.11 --target "$RELEASE_COMMIT" --title 'LRX Torn Tracker 1.6.11' --notes-file stage/notes.md --draft
          fi
          gh release upload v1.6.11 stage/updates/latest.json stage/updates/torntracker-app-1.6.11.zip stage/updates/LRX-Torn-Tracker-win32-x64-1.6.11.zip stage/updates/LRX-Torn-Tracker-Windows-x64.zip stage/updates/SHA256SUMS.txt --clobber
          gh release edit v1.6.11 --draft=false --latest

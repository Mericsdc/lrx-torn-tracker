<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <defs>
    <clipPath id="cay-canton"><rect width="150" height="90"/></clipPath>
    <clipPath id="cay-diag">
      <path d="M0 0 L75 45 L0 45 Z M75 0 L150 0 L75 45 Z M75 45 L150 45 L150 90 Z M0 90 L75 45 L75 90 Z"/>
    </clipPath>
    <clipPath id="cay-shield">
      <path d="M196 58 H254 V95 C254 118 225 133 225 133 C225 133 196 118 196 95 Z"/>
    </clipPath>
    <linearGradient id="wave" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="26%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="52%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="78%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.20"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" fill="#012169"/>
  <!-- Union Jack Canton -->
  <g clip-path="url(#cay-canton)">
    <path d="M0 0 L150 90 M150 0 L0 90" stroke="#f5f6f7" stroke-width="18"/>
    <path d="M0 0 L150 90 M150 0 L0 90" stroke="#c8102e" stroke-width="11" clip-path="url(#cay-diag)"/>
    <path d="M75 0 V90 M0 45 H150" stroke="#f5f6f7" stroke-width="28"/>
    <path d="M75 0 V90 M0 45 H150" stroke="#c8102e" stroke-width="16"/>
  </g>
  <!-- Cayman Islands Coat of Arms -->
  <g>
    <!-- Pineapple & Turtle Crest -->
    <ellipse cx="225" cy="40" rx="5.5" ry="7" fill="#e5a91a"/>
    <path d="M225 30 L221 35 H229 Z" fill="#2d8a4e"/>
    <ellipse cx="225" cy="50" rx="13" ry="5" fill="#2d8a4e"/>
    <rect x="210" y="54" width="30" height="3.5" rx="1.5" fill="#d9e4f5"/>
    <!-- Heraldic Shield -->
    <g clip-path="url(#cay-shield)">
      <rect x="196" y="58" width="58" height="76" fill="#f5f6f7"/>
      <rect x="196" y="58" width="58" height="23" fill="#c8102e"/>
      <!-- Golden lion -->
      <path d="M210 72 C215 67 224 67 234 69 L240 67 L239 74 L232 74 L224 75 L211 75 Z" fill="#f2c438"/>
      <!-- Wavy sea bars -->
      <path d="M194 87 Q204 83 214 87 T234 87 T256 87" fill="none" stroke="#1e64b7" stroke-width="6"/>
      <path d="M194 101 Q204 97 214 101 T234 101 T256 101" fill="none" stroke="#1e64b7" stroke-width="6"/>
      <path d="M194 115 Q204 111 214 115 T234 115 T256 115" fill="none" stroke="#1e64b7" stroke-width="6"/>
      <path d="M194 128 Q204 124 214 128 T234 128 T256 128" fill="none" stroke="#1e64b7" stroke-width="6"/>
      <!-- Three green stars with gold trim -->
      <polygon points="212,89 214,95 220,95 215,99 217,105 212,101 207,105 209,99 204,95 210,95" fill="#1d8348" stroke="#f2c438" stroke-width="1.3"/>
      <polygon points="238,89 240,95 246,95 241,99 243,105 238,101 233,105 235,99 230,95 236,95" fill="#1d8348" stroke="#f2c438" stroke-width="1.3"/>
      <polygon points="225,108 227,114 233,114 228,118 230,124 225,120 220,124 222,118 217,114 223,114" fill="#1d8348" stroke="#f2c438" stroke-width="1.3"/>
    </g>
    <path d="M196 58 H254 V95 C254 118 225 133 225 133 C225 133 196 118 196 95 Z" fill="none" stroke="#e5b83b" stroke-width="2.5"/>
    <!-- Motto ribbon -->
    <path d="M192 136 Q225 148 258 136 L254 146 Q225 157 196 146 Z" fill="#e5b83b"/>
  </g>
  <rect width="300" height="180" fill="url(#wave)"/>
</svg>
